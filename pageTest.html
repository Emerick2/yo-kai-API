<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Yokai 3D Viewer</title>
    <style>
        body { font-family: sans-serif; background: #f0f0f0; margin: 20px; }
        * { user-select: none; }
        #nom { font-size: 1.5em; font-weight: bold; margin-bottom: 10px; user-select: text;}
        img { border: 2px solid #ffffff00; height: 100px; margin-right: 10px; }
        #container3D { width: 100%; height: 500px; background: #ff8b8b00; border-radius: 10px; margin-top: 15px; }
        .btns { margin-top: 15px; }
        button { padding: 10px 15px; cursor: pointer; font-size: 16px; }
    </style>
</head>
<body>

    <div id="nom">Chargement...</div>
    <div id="display">
        <img id="img1" alt="Image 1"/>
        <img id="img2" alt="Image 2"/>
    </div>

    <div class="btns">
        <button onclick="Après(-1)">←</button>
        <button onclick="Après(1)">→</button><br>
        <button onclick="Après(-10)">-10</button>
        <button onclick="Après(+10)">+10</button><br>
        <button onclick="Après(-100)">-100</button>
        <button onclick="Après(100)">+100</button>
    </div>
    
    <div id="container3D"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.150.1/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.150.1/examples/jsm/"
        }
    }
    </script>

    <script src="ChangerPage.js" type="module"> </script>
</body>
</html>
